name: Docs

on:
  schedule:
    # GitHub cron uses UTC. 16:00 UTC is midnight in Asia/Taipei.
    - cron: "0 16 * * *"
    # Fresh-run retry at 00:30 Asia/Taipei. The preflight job skips this
    # run when the midnight deploy already succeeded for the current SHA.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  preflight:
    name: Check docs freshness
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
      last_success_sha: ${{ steps.decision.outputs.last_success_sha }}

    steps:
      - name: Decide whether docs need deployment
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "Manual run requested; deploying docs."
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "last_success_sha=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          last_success_sha="$(
            gh run list \
              --repo "${REPO}" \
              --workflow "${WORKFLOW_NAME}" \
              --branch "${CURRENT_BRANCH}" \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""'
          )"

          echo "last_success_sha=${last_success_sha}" >> "${GITHUB_OUTPUT}"

          if [ -z "${last_success_sha}" ]; then
            echo "No previous successful docs run found; deploying docs."
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          elif [ "${last_success_sha}" != "${CURRENT_SHA}" ]; then
            echo "Current commit differs from last successful docs run; deploying docs."
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Docs are already deployed for ${CURRENT_SHA}; skipping deploy."
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install documentation tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen graphviz

      - name: Configure documentation build
        run: cmake -S . -B build -DUNI20_DOCS_WEB=ON

      - name: Generate documentation
        run: cmake --build build --target doc

      - name: Verify generated site
        run: test -f build/docs/html/index.html

      - name: Disable Jekyll processing
        run: touch build/docs/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
